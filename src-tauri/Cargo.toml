[package]
name = "winease"
version = "3.5.0"
description = "WinEase 极简 Windows 工具箱。"
authors = ["soberbw-hash"]
edition = "2021"

[lib]
name = "winease_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
encoding_rs = "0.8"
sha2 = "0.10"
winreg = "0.55"
windows = { version = "0.62", features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_JobObjects", "Win32_Security"] }
file_icon_provider = "=1.0.2"
png = "0.18"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"
tauri-plugin-updater = "2.13.1"

[dev-dependencies]
minisign-verify = "0.2.5"
trash = "5"
filetime = "0.2.29"
tempfile = "3.27.0"
